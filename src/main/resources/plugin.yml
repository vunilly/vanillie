name: Vanillie
version: 1.4
main: com.vunilly.vanillie.Vanillie
api-version: '26.1'

commands:
  tag:
    description: Lets you add tags to your username
    aliases: [prefix]
    usage: /tag
  pvp:
    description: Lets you toggle pvp
    aliases: []
    usage: /pvp
  vote:
    description: Lets you vote for clear weather or time
    aliases: []
    usage: /vote
  size:
    description: Change your ingame size
    aliases: []
    usage: /size
  twitch:
    description: Lets you connect your Twitch channel and show a notification when you are live
    aliases: [ttv, stream]
    usage: /twitch
  vanillieconf:
    description: Plugin stuff you most likely don't care about
    aliases: [vconf]
    usage: /vanillie <reloadconfig|saveconfig|clearconfig|resetbook>
  vanillie:
    description: Plugin Info
    aliases: [vinfo, v]
    usage: /vanillieinfo