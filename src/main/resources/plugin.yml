name: Vanillie
version: 1.0
main: com.meinilly.vanillie.Vanillie
api-version: '26.1'

commands:
  tag:
    description: Lets you add tags to your username
    aliases: [prefix]
    usage: /tag
  confreload:
    description: Reloads the configuration files without destroying updated data
    aliases: [rlc]
    usage: /reload